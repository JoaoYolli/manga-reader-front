<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Libros</title>
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/libros.css">
  <link rel="stylesheet" href="../css/tv-mode.css">
  <link rel="stylesheet" href="../css/dark-theme.css">
  <link rel="icon" href="../img/logo.ico">
</head>
<body>
  <header class="header">
    <div class="div_centrado">
      <h1>Libros</h1>
    </div>
  </header>

  <main class="container">
    <div style="width:100%">
      <p style="text-align:center; margin-top:1rem;"><a href="../index.html">&larr; Volver</a></p>
      <h2>Biblioteca</h2>
      <p id="storage-total" class="mono" style="text-align:center; color:var(--color-ink-soft); font-size:0.8rem; margin-bottom:var(--gap);"></p>

      <section class="book-section" id="section-in-progress" style="display:none;">
        <h3>En progreso</h3>
        <div class="book-grid" id="books-in-progress"></div>
      </section>

      <section class="book-section" id="section-unread" style="display:none;">
        <h3>Sin leer</h3>
        <div class="book-grid" id="books-unread"></div>
      </section>

      <section class="book-section" id="section-finished" style="display:none;">
        <h3>Terminados</h3>
        <div class="book-grid" id="books-finished"></div>
      </section>

      <p id="empty-message" style="text-align:center; display:none;">Todavía no hay libros disponibles.</p>
    </div>
  </main>

  <script src="../js/settings.js"></script>
  <script src="../js/tv-mode.js"></script>
  <script src="/js/service_worker_register.js"></script>
  <script src="../js/offline-db.js"></script>
  <script src="../js/download-manager.js"></script>
  <script src="../js/book-cover.js"></script>
  <script src="../js/libros.js"></script>
</body>
</html>
