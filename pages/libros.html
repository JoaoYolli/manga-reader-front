<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Libros</title>
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/libros.css">
  <link rel="stylesheet" href="../css/tv-mode.css">
  <link rel="stylesheet" href="../css/dark-theme.css">
  <link rel="icon" href="../img/logo.ico">
</head>
<body>
  <header class="header">
    <div class="div_centrado">
      <h1>Libros</h1>
    </div>
    <div id="burger" class="burger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <nav id="menu" class="menu">
      <ul>
        <li><a href="../index.html">&larr; Volver a mangas</a></li>
        <li id="rescan-menu-item" style="display:none;"><a href="#" id="rescan-library">Actualizar biblioteca</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div style="width:100%">
      <p id="storage-total" class="mono library-meta-line"></p>
      <p id="library-scan-status" class="mono library-meta-line"></p>

      <section class="book-section" id="in-progress-shelf" style="display:none;">
        <h3>Lecturas en curso</h3>
        <div class="book-grid" id="books-in-progress"></div>
      </section>

      <div id="library-filters">
        <input type="text" id="library-search" placeholder="Buscar por título...">
        <div id="library-tag-filters" class="chip-filter-group">
          <button type="button" class="chip-filter active" data-tag="all">Todos</button>
          <button type="button" class="chip-filter" data-tag="unread">Sin leer</button>
          <button type="button" class="chip-filter" data-tag="in-progress">En progreso</button>
          <button type="button" class="chip-filter" data-tag="finished">Terminado</button>
        </div>
        <select id="library-collection-filter">
          <option value="">Todas las colecciones</option>
        </select>
      </div>

      <nav id="library-breadcrumb" class="mono"></nav>

      <div class="book-grid" id="library-grid"></div>

      <p id="empty-message" style="text-align:center; display:none;">Todavía no hay libros disponibles.</p>
    </div>
  </main>

  <script src="../js/settings.js"></script>
  <script src="../js/tv-mode.js"></script>
  <script src="/js/service_worker_register.js"></script>
  <script src="../js/offline-db.js"></script>
  <script src="../js/download-manager.js"></script>
  <script src="../js/book-cover.js"></script>
  <script src="../js/libros.js"></script>
</body>
</html>
