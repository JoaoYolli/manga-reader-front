<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de libro</title>
    <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/libro-lector.css">
    <link rel="stylesheet" href="../css/tv-mode.css">
    <link rel="stylesheet" href="../css/dark-theme.css">
    <link rel="icon" href="../img/logo.ico">
</head>

<body>
    <header>
        <img id="home-button" src="../img/home.png" alt="Volver a Libros" onclick="window.location.href = 'libros.html';">
        <h1 id="book-title">Cargando…</h1>
        <button id="book-nav-btn" class="btn btn-icon" title="Navegar por capítulos / ir a página" style="display:none;">
            <span class="icon icon-list"></span>
        </button>
        <button id="download-book-btn" class="btn btn-icon" title="Descargar para leer sin conexión">
            <span class="icon icon-download"></span>
        </button>
    </header>

    <main>
        <p id="reader-status">Cargando libro…</p>
        <div id="epub-viewer" style="display:none;"></div>
        <div id="pdf-viewer" style="display:none;">
            <canvas id="pdf-canvas"></canvas>
        </div>
        <div id="reader-nav">
            <button id="prev-page-btn" class="btn btn-sm">&larr; Anterior</button>
            <span id="page-indicator" class="mono"></span>
            <button id="next-page-btn" class="btn btn-sm">Siguiente &rarr;</button>
        </div>
    </main>

    <script src="../js/settings.js"></script>
    <script src="../js/tv-mode.js"></script>
    <script src="../js/vendor/jszip.min.js"></script>
    <script src="../js/vendor/epub.min.js"></script>
    <script src="../js/vendor/pdf.min.js"></script>
    <script src="../js/offline-db.js"></script>
    <script src="../js/book-cover.js"></script>
    <script src="../js/libro-lector.js"></script>
</body>

</html>
