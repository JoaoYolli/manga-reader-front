<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo (offline)</title>
    <link rel="stylesheet" href="../css/chapter.css">
    <link rel="icon" href="../img/logo.ico">
</head>

<body>

    <header>
        <!-- Logo que redirige a la sección Offline -->
        <img id="home-button" src="../img/home.png" alt="Volver a Offline" onclick="window.location.href = 'offline.html';">
        <img src="../img/manga.png" id="logo" alt="Volver a los capítulos del manga" onclick="redirectToOfflineManga()">

        <h1>Capítulo del Manga (offline)</h1>
    </header>

    <main>
        <section id="chapter-details">
            <div>
                <label for="chapter-select">Selecciona un capítulo:</label>
                <select id="chapter-select" onchange="loadChapterFromSelector()">
                    <option value="">Cargando capítulos...</option>
                </select>
            </div>

            <div id="image-size-control">
                <label for="image-size-range">Tamaño de imagen:</label>
                <input type="range" id="image-size-range" min="40" max="100" step="5" value="100">
            </div>

            <h2 class="chapter-title" id="chapter-title">Cargando...</h2>

            <div id="chapter-images"></div>

            <div id="navigation-buttons" style="display: none;">
                <button id="prev-chapter">Capítulo anterior</button>
                <button id="next-chapter">Capítulo siguiente</button>
            </div>
        </section>
    </main>

    <script src="../js/offline-db.js"></script>
    <script src="../js/reader-size-control.js"></script>
    <script src="../js/chapter-image-loader.js"></script>
    <script src="../js/offline-chapter.js"></script>
</body>

</html>
