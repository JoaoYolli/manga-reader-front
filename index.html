  <header class="header">
    <div class="div_centrado">
      <h1>Buscador de Manga</h1>
    </div>
    <!-- Botón hamburguesa -->
    <div id="burger" class="burger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <!-- Menú desplegable -->
    <nav id="menu" class="menu">
      <ul>
        <li><a href="#" id="cerrar-sesion" >Cerrar sesion</a></li>
        <li><a href="pages/offline.html">Offline</a></li>
        <li><a href="#" id="open-settings">Ajustes</a></li>

            <li><a href=".\downloads\Manga Reader Setup 1.0.0.exe" download="MangaReader.exe">Windows Installer</a></li>

          </ul>
        </li>
      </ul>

  <main>
    <div class="div_centrado">  
      <input
      type="text"
      id="search-box"

    <div id="results"></div>
    <h2>Favoritos</h2>
    <div id="favorites"></div>
  </main>

  <script src="js/settings.js"></script>

  <script src="js/auth.js"></script>
